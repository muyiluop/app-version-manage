name: Build and Push Image (Gitea)

# 与 GitHub 的 docker-image.yml 保持同一套流程：质量门禁 -> 构建并推送。
# 只差两处（都是「推送目标」层面的差异）：
#   1. 镜像地址：Gitea 内置镜像仓库（见 env.REGISTRY / env.IMAGE_NAME）
#   2. 凭据：优先 secrets.DOCKERHUB_TOKEN，其次 secrets.GITEA_TOKEN
#      （沿用仓库里既有的 secret 名称，无需新建）
#
# 构建方式与 GitHub 完全相同：docker/setup-buildx-action + docker/build-push-action，
# 不使用手写的 docker build / docker push 命令。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "要构建的版本标签（覆盖 release 标签）"
        required: false
        default: ""

concurrency:
  group: image-gitea-${{ github.ref }}
  cancel-in-progress: false

env:
  # 改成你自己的 Gitea 地址与端口
  REGISTRY: git.dev.smartmeter.vip:8880
  # 镜像名 = <registry>/<owner>/<repo>
  IMAGE_NAME: git.dev.smartmeter.vip:8880/${{ github.repository }}

jobs:
  # 质量门禁：与 .github/workflows/verify.yml 中的命令保持一致
  # （Gitea 对 reusable workflow 的支持视版本而定，这里内联同一套检查，
  #   改动规则时请两处同步；若你的 Gitea >= 1.23 也可改成 uses: ./.github/workflows/verify.yml）
  backend-check:
    name: 后端（gofmt / vet / 测试）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt 检查
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...
      - name: 单元测试（含竞态检测）
        run: go test -race ./...

  frontend-check:
    name: 前端（类型 / 测试 / lint / 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - run: npm run build

  build-and-push:
    needs: [backend-check, frontend-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: 生成镜像标签与 OCI 标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}
            # 只有正式发布才移动 latest，避免预发布把 latest 指到测试版本
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !github.event.release.prerelease) }}

      - name: 登录 Gitea 镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.GITEA_TOKEN }}

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          # Gitea 没有 GHA 缓存后端；如你的 registry 支持 OCI 缓存清单，
          # 可放开下面两行以加速重复构建：
          # cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          # cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          # 不使用 provenance/sbom 附加证明：部分自建 registry 对附属清单支持不完整
          provenance: false
          sbom: false

      - name: 输出结果
        run: echo "${{ steps.meta.outputs.tags }}"
