# 默认只启动应用（SQLite + 本地磁盘），开箱即用：
#   docker compose up -d --build
#
# 使用 PostgreSQL:  docker compose --profile postgres up -d --build
# 使用 MinIO(S3):   docker compose --profile s3 up -d --build
#
# 敏感配置请复制 .env.example 为 .env 并填写。
services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: app-version-manage:v2
    container_name: appv
    restart: unless-stopped
    # 后端自带优雅退出（最多 15s），默认 10s 会被 Docker 强杀，这里放宽
    stop_grace_period: 30s
    ports:
      - "${APPV_HTTP_PORT:-8081}:80"
    environment:
      APPV_SERVER_MODE: release
      APPV_SERVER_PORT: "9080"
      APPV_JWT_SECRET: ${APPV_JWT_SECRET:?请先在 .env 中设置 APPV_JWT_SECRET}
      APPV_DOWNLOAD_TOKEN_KEY: ${APPV_DOWNLOAD_TOKEN_KEY:?请先在 .env 中设置 APPV_DOWNLOAD_TOKEN_KEY}
      APPV_SHARE_PASSWORD_PEPPER: ${APPV_SHARE_PASSWORD_PEPPER:-}
      APPV_ADMIN_INITIAL_PASSWORD: ${APPV_ADMIN_INITIAL_PASSWORD:-}
      APPV_DATABASE_DRIVER: ${APPV_DATABASE_DRIVER:-sqlite}
      APPV_DATABASE_PATH: /data/app_version.db
      APPV_DATABASE_DSN: ${APPV_DATABASE_DSN:-}
      APPV_STORAGE_DRIVER: ${APPV_STORAGE_DRIVER:-local}
      APPV_STORAGE_LOCAL_ROOT: /data/uploads
      APPV_STORAGE_S3_ENDPOINT: ${APPV_STORAGE_S3_ENDPOINT:-}
      APPV_STORAGE_S3_BUCKET: ${APPV_STORAGE_S3_BUCKET:-}
      APPV_STORAGE_S3_ACCESS_KEY: ${APPV_STORAGE_S3_ACCESS_KEY:-}
      APPV_STORAGE_S3_SECRET_KEY: ${APPV_STORAGE_S3_SECRET_KEY:-}
      APPV_STORAGE_S3_FORCE_PATH_STYLE: "true"
    volumes:
      - appv-data:/data

  postgres:
    image: postgres:16-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-appv}
      POSTGRES_DB: ${POSTGRES_DB:-appv}
    volumes:
      - appv-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appv}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    profiles: [s3]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-appv}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-appv-minio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - appv-minio:/data

volumes:
  appv-data:
  appv-pg:
  appv-minio:
