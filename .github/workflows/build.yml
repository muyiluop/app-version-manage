name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本 (例如: v1.0.0 或 latest)"
        required: true
        default: "latest"
      environment:
        description: "部署环境"
        required: true
        type: choice
        options:
          - production
          - staging
        default: "staging"

env:
  REGISTRY: git.dev.smartmeter.vip:8880 # 如果使用其他镜像仓库，修改这里
  IMAGE_NAME: git.dev.smartmeter.vip:8880/attach-software/app-version-manage # 修改为你的 Docker Hub 用户名和镜像名

jobs:
  build:
    runs-on: all-in-one

    steps:
      - name: Checkout repository
        uses: https://gh-proxy.com/github.com/actions/checkout@v4

      # - name: Set up Node.js
      #   uses: https://gh-proxy.com/github.com/actions/setup-node@v4
      #   with:
      #     node-version: "20"
      #     cache: "npm"
      #     cache-dependency-path: "frontend/package-lock.json"

      # - name: Setup Go
      #   uses: https://gh-proxy.com/github.com/actions/setup-go@v4
      #   with:
      #     go-version: "1.24"
      #     cache-dependency-path: backend/go.sum
      - name: Set version
        run: |
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
        shell: bash

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Backend
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o app .

      - name: Set up Docker Buildx
        uses: https://gh-proxy.com/github.com/docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: https://gh-proxy.com/github.com/docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: https://gh-proxy.com/github.com/docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: https://gh-proxy.com/github.com/appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            # 拉取新镜像
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}

            # 停止并删除旧容器
            docker stop app-version-manage || true
            docker rm app-version-manage || true

            # 运行新容器
            docker run -d \
              --name app-version-manage \
              --restart always \
              -p 80:80 \
              -v /data/app-version-manage/data:/app/data \
              -v /data/app-version-manage/uploads:/app/static/uploads \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
