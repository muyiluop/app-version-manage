name: Build and Push Image (GHCR)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "要构建的版本标签（覆盖 release 标签）"
        required: false
        default: ""

concurrency:
  group: image-ghcr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # 先跑质量门禁：测试不过就不产出镜像
  verify:
    uses: ./.github/workflows/verify.yml

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image: ghcr.io/${{ github.repository_owner }}/app-version-manage
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: 生成镜像标签与 OCI 标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/app-version-manage
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !github.event.release.prerelease) }}

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: 输出结果
        run: echo "${{ steps.meta.outputs.tags }}"

  # 构建成功不等于镜像能跑：这里真起一个容器验证
  smoke:
    name: 镜像冒烟验证
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # 镜像可能是私有包，冒烟前必须登录，否则 docker run 会拉取失败
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 启动镜像并检查健康与登录
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          VERSION: ${{ needs.build-and-push.outputs.version }}
        run: |
          set -e
          docker run -d --name appv-smoke -p 18080:80 \
            -e APPV_JWT_SECRET="$(openssl rand -hex 32)" \
            -e APPV_DOWNLOAD_TOKEN_KEY="$(openssl rand -hex 32)" \
            -e APPV_ADMIN_INITIAL_PASSWORD=smoke-123456 \
            "$IMAGE:$VERSION"

          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/readyz >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done

          echo "--- 容器日志 ---"
          docker logs appv-smoke || true

          if [ "$ok" != "1" ]; then
            echo "镜像健康检查未通过"
            docker rm -f appv-smoke || true
            exit 1
          fi

          # 再验登录：确认自动建表、初始管理员与鉴权链路都正常
          curl -fsS -X POST http://127.0.0.1:18080/api/v2/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"smoke-123456"}' >/dev/null

          echo "镜像冒烟验证通过（自动建表 / 初始管理员 / 登录均正常）"
          docker rm -f appv-smoke || true
