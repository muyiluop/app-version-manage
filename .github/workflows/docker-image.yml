name: Build and Push Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (overrides release tag)"
        required: false
        default: ""

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine version tag
        id: vars
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            if [ -n "${{ github.event.inputs.version }}" ]; then
              echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            else
              echo "tag=latest" >> $GITHUB_OUTPUT
            fi
          fi
      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          # 使用你 Gitea 的实际域名
          registry: git.dev.smartmeter.vip:8880
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            git.dev.smartmeter.vip:8880/${{ github.repository }}:${{ steps.vars.outputs.tag }}
            git.dev.smartmeter.vip:8880/${{ github.repository }}:latest

      - name: Output image
        run: |
          echo "Image pushed: git.dev.smartmeter.vip:8880/${{ github.repository }}:${{ steps.vars.outputs.tag }}"
