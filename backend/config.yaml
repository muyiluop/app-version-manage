# 本地开发默认配置（生产请通过环境变量覆盖敏感项）
server:
  port: 9080
  mode: debug

database:
  driver: sqlite          # sqlite | postgres | mysql
  path: ./data/app_version.db
  autoMigrate: true

storage:
  driver: local           # local | s3
  local:
    root: ./static/uploads
  signedUrlTtlMinutes: 30

log:
  level: info             # debug | info | warn | error
  format: text            # text | json

upload:
  maxSizeMB: 4096
